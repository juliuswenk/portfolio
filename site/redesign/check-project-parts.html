<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Project part checks</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<p role="status">Checking project parts…</p>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { createProjectParts } from './project-parts.mjs?v=native-scroll-1';
import { projectAssets, projectParts } from './project-assets.mjs?v=assembled-xray-1';
import { applyCobaltScattering } from './cobalt-sss.mjs';
const status = document.querySelector('[role="status"]');
function assert(condition, message) { if (!condition) throw new Error(message); }
function sameMatrix(a, b) { return a.elements.every((value, i) => Math.abs(value - b.elements[i]) < 1e-6); }
function stageWithRect(getRect) {
  const stage = document.createElement('div');
  stage.hidden = true;
  stage.getBoundingClientRect = getRect;
  document.body.append(stage);
  return stage;
}
try {
  const renderer = new THREE.WebGLRenderer();
  renderer.setSize(400, 400);
  const shaderErrors = [];
  renderer.debug.onShaderError = (gl, program) => shaderErrors.push(gl.getProgramInfoLog(program));
  function render(model, camera) {
    const scene = new THREE.Scene();
    scene.add(new THREE.DirectionalLight(0xffffff, 1));
    scene.add(model);
    renderer.render(scene, camera);
    assert(!shaderErrors.length, `Shader compilation: ${shaderErrors.join('; ')}`);
  }
  for (const asset of projectAssets) {
    const config = projectParts[asset.slug];
    const { scene: model } = await new GLTFLoader().loadAsync(`./assets/${asset.file}.glb?v=section-models-2`);
    applyCobaltScattering(model, THREE.ShaderChunk);
    model.scale.setScalar(1.3);
    model.position.set(2, -1, .5);
    model.rotation.set(1.2, .2, -.15);
    model.updateMatrixWorld(true);
    const homeRotation = model.quaternion.clone();
    const rootInverse = model.matrixWorld.clone().invert();
    const original = [];
    model.traverse(mesh => {
      if (!mesh.isMesh) return;
      mesh.castShadow = mesh.receiveShadow = true;
      original.push({ mesh, matrix: mesh.matrixWorld.clone(), local: rootInverse.clone().multiply(mesh.matrixWorld), material: mesh.material });
    });
    const selections = config.parts.map(part => part.primitives ? part.primitives.map(index => original[index].mesh) : part.nodes.flatMap(name => {
      const meshes = [];
      model.getObjectByName(THREE.PropertyBinding.sanitizeNodeName(name)).traverse(mesh => { if (mesh.isMesh) meshes.push(mesh); });
      return meshes;
    }));
    const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, .1, 40);
    camera.position.set(.4, -.7, 16); camera.updateMatrixWorld(true);
    const originalChildren = new Set(model.children);
    const view = createProjectParts(model, camera, config);
    const groups = model.children.filter(child => !originalChildren.has(child));
    assert(groups.length === config.parts.length, `${asset.name}: every section has a complete model`);
    assert(groups.every(group => group.children.length === original.length), 'Each section contains exactly one copy of each original mesh');
    const contexts = groups.flatMap((group, index) => group.children.filter((_, sourceIndex) => !selections[index].includes(original[sourceIndex].mesh)));
    const highlights = groups.flatMap(group => group.children.filter(mesh => !contexts.includes(mesh)));
    const contextMaterial = contexts[0]?.material;
    assert(contexts.every(mesh => mesh.material === contextMaterial && !mesh.castShadow && !mesh.receiveShadow && !mesh.visible), 'Faint context shares a material, has no opaque shadows and stays hidden at home');
    assert(original.every(({ mesh }) => groups.includes(mesh.parent)), 'Every original mesh belongs to its section model');
    function assembled() {
      model.updateMatrixWorld(true);
      for (const { mesh, matrix, material } of original) {
        assert(sameMatrix(mesh.matrixWorld, matrix), 'Reassembly restores each original mesh transform');
        assert(mesh.material === material && mesh.castShadow && mesh.receiveShadow, 'Returning restores original materials and shadows');
      }
      assert(contexts.every(mesh => !mesh.visible), 'Returning hides every faint context mesh');
    }
    assembled();
    let scroll = 0, stageWidth = innerWidth - 40;
    const stages = config.parts.map((_, index) => stageWithRect(() => ({ left: 20, top: 120 + index * 800 - scroll, width: stageWidth, height: 260 })));
    view.setProject(stages);
    view.update(0, false); assembled();
    view.update(.425, false);
    assert(view.visible && contexts.every(mesh => mesh.visible), 'Opening fades in the complete assembly');
    if (contextMaterial) assert(Math.abs(contextMaterial.uniforms.xrayGain.value - .0225) < 1e-6, 'Context fades with the transition');
    assert(original.every(({ mesh, material }) => mesh.material !== material && mesh.material.uniforms === undefined), 'Original surfaces crossfade into X-ray');
    render(model, camera);
    view.update(.425, false);
    const xray = highlights[0].material;
    assert(xray.isShaderMaterial && xray.depthTest && !xray.depthWrite && xray.side === THREE.FrontSide, 'Highlighted parts use the lightweight X-ray shader');
    assert(highlights.every(mesh => mesh.material === xray && !mesh.castShadow && !mesh.receiveShadow), 'All selected meshes use full-strength X-ray');
    if (contextMaterial) assert(Math.abs(contextMaterial.uniforms.xrayGain.value - .045) < 1e-6, 'Unselected meshes remain faint');
    function aligned() {
      model.updateMatrixWorld(true);
      groups.forEach((group, index) => {
        const rect = stages[index].getBoundingClientRect(), p = group.getWorldPosition(new THREE.Vector3()).project(camera);
        assert(Math.abs(group.getWorldQuaternion(new THREE.Quaternion()).dot(homeRotation)) > .999999, 'Every assembly preserves the home-page pose');
        assert(Math.abs((p.x + 1) * innerWidth / 2 - rect.left - rect.width / 2) < .001, 'Complete assembly is horizontally centred in its section');
        assert(Math.abs((1 - p.y) * innerHeight / 2 - rect.top - rect.height / 2) < .001, 'Complete assembly follows its scrolling section');
        const first = group.children[0];
        group.children.forEach((mesh, sourceIndex) => {
          assert(mesh.geometry === original[sourceIndex].mesh.geometry, 'Section models share the original geometry');
          const relative = first.matrixWorld.clone().invert().multiply(mesh.matrixWorld);
          const expected = original[0].local.clone().invert().multiply(original[sourceIndex].local);
          assert(sameMatrix(relative, expected), 'Every mesh, bright or faint, retains its original position, scale and rotation relative to the complete model');
          const selected = selections[index].includes(original[sourceIndex].mesh);
          assert(mesh.material === (selected ? xray : contextMaterial), 'Each section highlights exactly its assigned meshes, without a duplicate faint copy');
        });
      });
    }
    aligned(); render(model, camera);
    const rendererSize = renderer.getSize(new THREE.Vector2()), pixelRatio = renderer.getPixelRatio();
    assert(view.settled && view.showStills(renderer) && view.static, 'Settled sections use native scrolling canvases');
    assert(renderer.getSize(new THREE.Vector2()).equals(rendererSize) && renderer.getPixelRatio() === pixelRatio && !renderer.getRenderTarget(), 'Snapshot rendering restores the shared renderer');
    const stills = stages.map(stage => stage.querySelector('canvas'));
    assert(stills.every(canvas => canvas && canvas.width > 0 && canvas.height > 0), 'Every section receives a rendered model');
    assert(stills.every(canvas => {
      const pixels = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height).data;
      return pixels.some((value, index) => index % 4 !== 3 && value > 10);
    }), 'Section snapshots contain visible X-ray artwork');
    assert(!shaderErrors.length, 'Snapshot shaders compile');
    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
    assert(raycaster.intersectObjects(contexts, false).length === 0, 'Context never intercepts project picking');
    assert(!view.update(0, false), 'Settled reading does not keep rendering');
    const frameCount = renderer.info.render.frame;
    scroll = 850;
    assert(view.showStills(renderer) && renderer.info.render.frame === frameCount, 'Scrolling reuses the existing images without WebGL rendering');
    assert(stills.every((canvas, index) => canvas.parentElement === stages[index]), 'Models remain attached to their scrolling sections');
    view.invalidate(); view.update(0, false); aligned();
    stageWidth = 280; view.invalidate(); view.update(0, false); aligned();
    assert(view.showStills(renderer) && renderer.info.render.frame > frameCount, 'Stage resizing refreshes the images');
    assert(stages.every(stage => stage.querySelectorAll('canvas').length === 1), 'Resizing does not accumulate image canvases');
    view.setProject(null);
    assert(!view.static && stages.every(stage => !stage.querySelector('canvas')), 'Returning removes snapshots and resumes live 3D');
    stages.forEach(stage => { stage.remove(); stage.getBoundingClientRect = () => { throw new Error('Return accessed detached reading DOM'); }; });
    view.update(.425, false); render(model, camera);
    view.update(.425, false); assembled();
    assert(!view.visible, 'Return completes');
    if (config.repeat) assert(groups.filter(group => group.visible).length === 1, 'Only the original LED remains at home');
    const fresh = config.parts.map(() => stageWithRect(() => ({ left: 20, top: 120, width: innerWidth - 40, height: 260 })));
    view.setProject(fresh, true); view.update(0, true);
    assert(view.visible && highlights.every(mesh => mesh.material === xray), 'Direct/reduced-motion entry shows complete X-ray models immediately');
    assert(view.showStills(renderer), 'Direct and reduced-motion entry also use native scrolling');
    view.setProject(null, true); assembled();
    view.setProject(fresh); view.update(.2, false);
    view.setProject(null); view.update(.1, false);
    view.setProject(fresh); view.update(.85, false);
    assert(highlights.every(mesh => mesh.material === xray), 'Interrupted transitions still reach full X-ray');
    let xrayDisposed = false, contextDisposed = !contextMaterial;
    xray.addEventListener('dispose', () => xrayDisposed = true);
    contextMaterial?.addEventListener('dispose', () => contextDisposed = true);
    let geometryDisposed = false;
    original.forEach(({ mesh }) => mesh.geometry.addEventListener('dispose', () => geometryDisposed = true));
    view.dispose(); assembled();
    assert(xrayDisposed && contextDisposed && contexts.every(mesh => !mesh.parent), 'Disposal removes faint copies and releases temporary materials');
    assert(!geometryDisposed, 'Disposal retains shared original geometry');
    fresh.forEach(stage => stage.remove());
  }
  renderer.dispose();
  status.textContent = 'Passed for all five projects: native scrolling section canvases with visible X-ray artwork, no WebGL draws on scroll, renderer restoration, resize refresh, live 3D return, complete assemblies, exact selected mesh positions, home-page pose, shader compilation, fades, interrupted transitions, original material/shadow restoration, disposal, repeated LEDs and reduced motion.';
} catch (error) {
  status.textContent = `FAILED: ${error.message}`;
  throw error;
}
</script>
</html>
